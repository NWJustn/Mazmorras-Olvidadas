<style>
:root{--bg:#14121f;--edge:#463e73;--torch:#ffb347;--hp:#e5484d;--text:#e8e4f5;--dim:#9a93bd;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Courier New",monospace;font-weight:bold;touch-action:none;user-select:none}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:8px 12px;gap:8px}
#hud{display:flex;justify-content:space-between;font-size:15px}
#bar{height:10px;background:#0b0a14;border:2px solid var(--edge)}
#fill{height:100%;background:var(--hp);width:100%}
#wrap{flex:1;min-height:0;border:2px solid var(--edge)}
#cv{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#0b0a14;display:block}
#log{min-height:34px;text-align:center;color:var(--dim);font-size:14px}
#inv{display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px;color:var(--dim)}
#inv button{width:48px;height:48px;background:#2b2644;border:2px solid var(--edge);padding:0;display:flex;align-items:center;justify-content:center}
#inv canvas{width:32px;height:32px;image-rendering:pixelated}
#pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center}
#pad button{background:#2b2644;color:var(--text);border:2px solid var(--edge);border-bottom-width:5px;font:inherit;font-size:22px;padding:0}
#pad button:active{border-bottom-width:2px;transform:translateY(3px);background:#3a3360}
#ov,#shop,#menu{position:fixed;inset:0;background:rgba(10,8,20,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#ov h1,#shop h1,#menu h1{margin:0;font-size:30px;color:var(--hp)}
#menu h1{color:var(--torch);font-size:24px;line-height:1.2}
#cls{display:flex;gap:8px;justify-content:center;width:100%}
#cls button{background:#2b2644;color:var(--text);border:3px solid var(--edge);padding:8px 4px;width:31%;max-width:120px;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
#cls button.on{border-color:var(--torch);background:#3a3360}
#cls canvas{width:64px;height:64px;image-rendering:pixelated}
#cd{min-height:44px;color:var(--dim);font-size:14px}
#lg canvas{width:72px;height:72px;image-rendering:pixelated}
#intro{position:fixed;inset:0;z-index:40;background:#0b0a14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;transition:opacity .4s}
#ic{width:100%;max-width:420px;flex:1;min-height:0;object-fit:contain;image-rendering:pixelated}
#it{min-height:72px;text-align:center;font-size:26px;letter-spacing:3px;color:var(--torch);white-space:pre-line;line-height:1.25}
#itap{min-height:24px;color:var(--dim);font-size:14px;visibility:hidden;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.2}}
#cin,#pcin{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
#cc,#pc{width:100%;max-width:420px;flex:1;min-height:0;object-fit:contain;image-rendering:pixelated}
#ct,#pt{min-height:84px;text-align:center;font-size:16px;color:var(--text);white-space:pre-line;max-width:420px}
#ct b{display:block;color:var(--torch);font-size:24px;margin-bottom:8px}
#csk,#psk{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;background:none;color:var(--dim);border:2px solid var(--edge);font:inherit;font-size:13px;padding:6px 10px}
#shop h1{color:var(--torch)}
#shop button:disabled{opacity:.4}
#so{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px;max-height:62vh;overflow:auto}
#ov button,#shop button,#menu #play{background:var(--torch);color:#241a05;border:0;border-bottom:5px solid #b36b00;padding:12px 20px;font:inherit;font-size:16px}
</style>

};
const FACES=['slime','bat','gob','skel','drag'];
const CL={mago:{n:'MAGO',hp:10,atk:2,rng:3,d:'Magia a distancia: ataca hasta 3 casillas'},caballero:{n:'CABALLERO',hp:14,atk:3,rng:1,d:'Cuerpo a cuerpo, muy resistente'},arquero:{n:'ARQUERO',hp:9,atk:2,rng:4,d:'Dispara hasta 4 casillas, 25% de crítico'}};
const WP={
 caballero:[['Daga +2 atq',14,1,2],['Espada +3 atq',24,2,3],['Lanza +3 atq (+1 alc)',28,2,3,1],['Hacha +5 atq',40,3,5]],
 mago:[['Varita +2 atq',14,1,2],['Bastón +3 atq',24,2,3],['Grimorio +5 atq',40,3,5]],
 arquero:[['Arco corto +2 atq',14,1,2],['Arco largo +3 atq (+1 alc)',24,2,3,1],['Ballesta +5 atq',40,3,5]]};
let pick='mago';
const PRE={mago:'m',caballero:'c',arquero:'a'};
const WS={
 m0:[['#8a5a2b',13,2,2,13],['#6e4520',14,2,1,13]],
 m1:[['#a8743a',13,7,1,8],['#ffd23f',12,4,3,3],['#fff6b0',13,5,1,1],['#ffd23f',13,3,1,1],['#ffd23f',13,7,1,1]],
 m2:[['#a8743a',13,3,2,12],['#6e4520',14,3,1,12],['#5ee7ff',12,0,4,4],['#e0fbff',13,1,1,1],['#2aa9c4',12,3,4,1]],
 m3:[['#4a1a5e',10,6,6,8],['#8d3cb8',10,6,6,1],['#e8e4f5',11,7,4,6],['#4a1a5e',13,7,1,6],['#ffd23f',12,9,2,2],['#5ee7ff',14,4,1,1],['#ff7ad9',11,4,1,1],['#fff',13,3,1,1]],
 c0:[['#b8731f',15,3,1,6],['#8b5a2b',14,9,3,1],['#5a3b1e',15,10,1,2]],
 c1:[['#eaf2ff',15,6,1,4],['#b8731f',14,10,3,1],['#5a3b1e',15,11,1,2]],
 c2:[['#eaf2ff',15,1,1,9],['#b9c4dc',14,3,1,6],['#ffd23f',13,10,3,1],['#5a3b1e',15,11,1,3],['#ffd23f',15,14,1,1]],
 c3:[['#8b5a2b',15,2,1,13],['#eaf2ff',15,0,1,1],['#eaf2ff',14,1,2,2],['#e5484d',14,3,2,1]],
 c4:[['#8b5a2b',15,3,1,12],['#9fb4d9',12,2,3,5],['#dfe6f2',12,3,1,3],['#6d7a9c',14,3,1,3],['#dfe6f2',13,2,1,1]],
 a0:[['#d9a24a',3,3,1,1],['#d9a24a',2,4,1,1],['#d9a24a',1,5,1,2],['#d9a24a',0,7,1,3],['#8a5a1a',1,10,1,2],['#d9a24a',2,12,1,1],['#d9a24a',3,13,1,1],['#e8e4f5',3,4,1,9]],
 a1:[['#c0642a',2,5,1,1],['#c0642a',1,6,1,5],['#c0642a',2,11,1,1],['#e8e4f5',3,6,1,5]],
 a2:[['#6e4520',2,2,1,2],['#6e4520',1,4,1,3],['#6e4520',0,7,1,3],['#6e4520',1,10,1,3],['#6e4520',2,13,1,2],['#ffd23f',3,1,1,1],['#ffd23f',3,15,1,1],['#e8e4f5',3,2,1,13]],
 a3:[['#5a3b1e',1,8,6,2],['#cbd5e1',0,5,1,8],['#e8e4f5',1,6,1,6],['#e5484d',2,7,1,1],['#ffd23f',0,5,1,1],['#ffd23f',0,12,1,1]]
};
function wpn(c,wi,bx,by){const L=WS[PRE[c]+(wi+1)]||[];L.forEach(([,x,y,w,h])=>{cx.fillStyle='#0b0a14';cx.fillRect(bx+x-1,by+y-1,w+2,h+2)});L.forEach(([col,x,y,w,h])=>{cx.fillStyle=col;cx.fillRect(bx+x,by+y,w,h)})}
let S;
const isBoss=f=>f==20||(f>1&&f%5==1);
const isShop=f=>f%5==0&&f<20;
const isPz=f=>S.pzf.includes(f);
let AC=null;function buzz(s){try{const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;if(H)H.impact({style:s});else if(navigator.vibrate)navigator.vibrate(s=='HEAVY'?60:s=='MEDIUM'?35:15)}catch(e){}}
function snd(f,d=.08,t='square'){if(t=='sawtooth')buzz('HEAVY');else if(f==520)buzz('MEDIUM');else if(f==260)buzz('LIGHT');try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}

const SC={};
function mk(){const c=document.createElement('canvas');c.width=c.height=TS+2;return c}
function sc(n){
  if(SC[n])return SC[n];
  const o=SP[n],z=o.m.length,k=TS/z,c=mk(),g=c.getContext('2d'),t=mk(),tg=t.getContext('2d');
  o.m.forEach((row,j)=>{for(let i=0;i<z;i++){const ch=row[i];if(ch!=='.'&&!(o.sk&&o.sk.includes(ch))){tg.fillStyle=o.p[ch];tg.fillRect(1+i*k,1+j*k,k,k)}}});
  const s=mk(),sg=s.getContext('2d');sg.drawImage(t,0,0);sg.globalCompositeOperation='source-in';sg.fillStyle='#0b0a14';sg.fillRect(0,0,TS+2,TS+2);
  [[-1,0],[1,0],[0,-1],[0,1]].forEach(([a,b])=>g.drawImage(s,a,b));
  tg.globalCompositeOperation='source-atop';const gr=tg.createLinearGradient(0,0,0,TS+2);gr.addColorStop(0,'rgba(255,255,255,.16)');gr.addColorStop(1,'rgba(0,0,0,.3)');tg.fillStyle=gr;tg.fillRect(0,0,TS+2,TS+2);
  g.drawImage(t,0,0);return SC[n]=c;
}
function spr(n,x,y,oy){const bx=Math.round(x*TS),by=Math.round(y*TS);if(n!=='stairs'){cx.fillStyle='rgba(0,0,0,.32)';cx.fillRect(bx+3,by+14,10,2)}cx.drawImage(sc(n),bx-1,by+(oy||0)-1)}
function sm(o){if(o.vx===undefined){o.vx=o.x;o.vy=o.y}o.vx+=(o.x-o.vx)*.3;o.vy+=(o.y-o.vy)*.3;if(Math.abs(o.x-o.vx)<.02)o.vx=o.x;if(Math.abs(o.y-o.vy)<.02)o.vy=o.y}
function fx(x,y,txt,col){S.fxs.push({x:x*TS+8,y:y*TS+6,txt,col,t:performance.now()})}
function burst(x,y,col){for(let i=0;i<10;i++)S.pt.push({x:x*TS+8,y:y*TS+8,vx:(Math.random()-.5)*1.8,vy:(Math.random()-.9)*1.8,t:performance.now(),col})}

function reach(a,b){
  const q=[a],seen=new Set([key(a.x,a.y)]);
  while(q.length){const c=q.shift();if(c.x==b.x&&c.y==b.y)return true;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const x=c.x+dx,y=c.y+dy,k=key(x,y);
      if(x<0||y<0||x>=W||y>=H||S.walls.has(k)||seen.has(k))continue;seen.add(k);q.push({x,y})}}
  return false;
}

function reachSet(){const q=[S.p],seen=new Set([key(S.p.x,S.p.y)]);while(q.length){const c=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const x=c.x+dx,y=c.y+dy,k=key(x,y);if(x<0||y<0||x>=W||y>=H||S.walls.has(k)||seen.has(k)||(S.shop&&S.shop.x==x&&S.shop.y==y))continue;seen.add(k);q.push({x,y})}}return seen}

function newGame(h){S={floor:1,hp:CL[pick].hp,max:CL[pick].hp,atk:CL[pick].atk,rng:CL[pick].rng,cls:pick,wi:-1,pzf:mkPz(),gold:0,over:false,hard:h===true,inv:[],bw:{},sh:0,st:{dealt:0,taken:0,kills:0},fxs:[],pt:[],pj:[]};gen();$('ov').style.display='none';$('shop').style.display='none'}

function gen(){
  let ok=false;
  while(!ok){
    S.walls=new Set();
    for(let i=0;i<(isBoss(S.floor)?4:14);i++)S.walls.add(key(r(W),1+r(H-2)));
    S.p={x:3,y:H-1};S.walls.delete(key(3,H-1));
    S.stairs={x:r(W),y:0};S.walls.delete(key(S.stairs.x,0));
    ok=reach(S.p,S.stairs);
  }
  const used=new Set([key(S.p.x,S.p.y),key(S.stairs.x,S.stairs.y)]);
  let R=null;const free=()=>{if(!R)R=reachSet();let x,y,k,t=0;do{x=r(W);y=r(H-2);k=key(x,y)}while((!R.has(k)||used.has(k))&&++t<500);used.add(k);return{x,y}};
  S.shop=null;
  if(isShop(S.floor)){let m,g=0;do{m=free();S.walls.add(key(m.x,m.y));g=reach(S.p,S.stairs);S.walls.delete(key(m.x,m.y))}while(!g);S.shop=m;R=null}
  S.en=[];

    const cy=Math.round(104-l*52);k.fillStyle='#fff3b0';for(let y=-12;y<=12;y++){const w=Math.floor(Math.sqrt(144-y*y));k.fillRect(56-w,cy+y,2*w,1)}

    drawS(k,'cave',70,70,2);drawS(k,S.cls,22,76+bob,2);
  }else{
    for(let n=0;n<30;n++)if(Math.sin(now/200+n)>0){k.fillStyle='#fff';k.fillRect(Math.round(rn(n)*112),Math.round(rn(n+50)*70),1,1)}
    k.fillStyle='#1a1630';k.fillRect(0,104,112,40);drawS(k,'cave',24,40,4);
    if(Math.sin(now/180)>.2){k.fillStyle='rgba(255,179,71,.5)';k.fillRect(46,78,8,8);k.fillRect(58,78,8,8)}
  }
  const sp=CT[i].split('|'),n=Math.floor(e/32);
  const h=sp.length>1?'<b>'+sp[0]+'</b>'+sp[1].slice(0,Math.max(0,n-10)):CT[i].slice(0,n);
  if(h!==cine.h){$('ct').innerHTML=h;cine.h=h}
  requestAnimationFrame(cf);
}

    k.fillStyle='#4a4270';k.fillRect(88,78,14,34);k.fillRect(88,75,3,3);k.fillRect(94,75,3,3);k.fillRect(100,75,3,3);k.fillStyle=(i==0||l<.5)?'#ffd23f':'#1a1630';k.fillRect(93,86,4,6);
    if(i==1){k.fillStyle='#e5484d';for(let y=112;y<144;y++){k.fillRect(56+Math.round(Math.sin(y*.5)*4*(y-112)/32),y,Math.max(1,Math.round(l*5)),1)}

    const g=k.createRadialGradient(56,96,8,56,96,52);g.addColorStop(0,'rgba(255,179,71,'+(.12+.1*Math.sin(now/200))+')');g.addColorStop(1,'rgba(255,179,71,0)');k.fillStyle=g;k.fillRect(0,40,112,104);
    drawS(k,'cave',32,70,3,Math.min(1,l*3));
